<main class="pagina-adm">

    <section class="perfil-adm">

        <div class="foto-perfil">
            <img src="/mascoterebirth.png" alt="Mascote Rebirth">
        </div>

        <div class="dados-adm">
            <h2>ADMINISTRADOR</h2>
            <p>PAINEL DE CONTROLE</p>
        </div>

        <button class="botao-sair" routerLink="/">SAIR</button>

    </section>


    <section class="cabecalho-adm">
        <h1>PAINEL ADMINISTRATIVO</h1>
        <p>GERENCIE OS PRODUTOS DA REBIRTH SUPPLEMENTS</p>
    </section>

    <section class="area-cadastro">

        <h2>CADASTRAR PRODUTO</h2>

        <div class="formulario-produto">

            <div class="campo">
                <label>NOME DO PRODUTO</label>
                <input type="text" placeholder="Ex: Whey Protein Rebirth">
            </div>

            <div class="campo">
                <label>CATEGORIA</label>

                <select>
                    <option>Whey Protein</option>
                    <option>Creatina</option>
                    <option>Pré-Treino</option>
                    <option>Hipercalórico</option>
                    <option>Acessórios</option>
                    <option>Vestuário</option>
                </select>
            </div>

            <div class="campo">
                <label>PREÇO</label>
                <input type="number" placeholder="Ex: 119,90">
            </div>

            <div class="campo">
                <label>ESTOQUE</label>
                <input type="number" placeholder="Ex: 20">
            </div>

        </div>

        <button class="botao-cadastrar">
            CADASTRAR PRODUTO
        </button>

    </section>

    <section class="area-produtos">

        <h2>PRODUTOS CADASTRADOS</h2>

        <table>
            <thead>
                <tr>
                    <th>ID PRODUTO</th>
                    <th>NOME PRODUTO</th>
                    <th>PREÇO PRODUTO</th>
                    <th>CATEGORIA PRODUTO</th>
                    <th>QUANTIDADE PRODUTO</th>
                </tr>
            </thead>

            <tbody>
                
            </tbody>
        </table>
    </section>

</main>
